[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mistake-book"
version = "0.1.0"
description = "本地小奥错题照片整理与 DOCX / Markdown 导出工具"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "latex2mathml>=3.81,<4",
  "matplotlib>=3.11,<4",
  "mathml-to-omml>=1.0,<2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4,<12",
  "pillow-heif>=0.18,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.12,<1",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
v2 = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.scripts]
mistake-book = "mistake_book.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mistake_book = ["static/*", "helpers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
